{% extends "base.html" %}

{% block title %}Add Growth Record - Coco NutriCare{% endblock %}
{% block page_title %}<a href="{{ url_for('parent.child_detail', child_id=child.id) }}">{{ child.name }}</a> / Add Growth Record{% endblock %}

{% block content %}
    <div class="card form-card">
        <form method="POST">
            <label>Measurement Date</label>
            <input type="date" name="date" max="{{ today }}" value="{{ request.form.get('date', today) }}" required>

            <label>Weight (kg)</label>
            <input type="number" name="weight_kg" step="0.1" min="0.5" max="150" placeholder="e.g. 12.4" value="{{ request.form.get('weight_kg', '') }}" required>

            <label>Height (cm)</label>
            <input type="number" name="height_cm" step="0.1" min="30" max="200" placeholder="e.g. 88" value="{{ request.form.get('height_cm', '') }}" required>

            <div class="form-actions">
                <button type="submit" class="btn">Save Record</button>
                <a href="{{ url_for('parent.child_detail', child_id=child.id) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
