<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Coco NutriCare</title>
    <style>
        body { background: #0b1a17; color: #e6efec; font-family: Inter, Arial, sans-serif; }
        .box { max-width: 400px; margin: 60px auto; background: #142b26; border: 1px solid #23403a; border-radius: 10px; padding: 24px; }
        label { display: block; margin-top: 12px; color: #8fa6a0; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; background: #0b1a17; color: #e6efec; border: 1px solid #23403a; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; margin-top: 18px; padding: 10px; background: #0e7a66; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .flash { padding: 8px; margin-bottom: 10px; border-radius: 6px; background: #23403a; }
        .flash.error { background: #f0962e; color: #0b1a17; }
        a { color: #19b394; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Forgot your password?</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

          <form method="POST">
            <p>Enter your email and we will send you a link to reset your password.</p>
            <label>Email</label>
            <input type="email" name="email" required>

            <button type="submit">Send Reset Link</button>
        </form>

        <p><a href="{{ url_for('auth.login') }}">Back to login</a></p>       
    </div>
</body>
</html>
